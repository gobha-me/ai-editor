# ============================================
# AI Editor - Kubernetes Deployment
# ============================================
# BASE_PATH is set per-environment via env var.
# No Traefik stripPrefix middleware needed — nginx handles sub-paths natively.
#
# Environments:
#   production (tag)   → BASE_PATH=/       → editor.gobha.ai
#   test (main merge)  → BASE_PATH=/test   → editor.gobha.ai/test
#   dev (PR)           → BASE_PATH=/dev    → editor.gobha.ai/dev
#
# Transition: update host to ai.gobha.me and paths as needed until
# editor.gobha.ai DNS is configured.
# ============================================

# --- Production ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-editor
  labels:
    app: ai-editor
    env: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-editor
      env: production
  template:
    metadata:
      labels:
        app: ai-editor
        env: production
    spec:
      containers:
      - name: ai-editor
        image: registry.gobha.me:5000/xcaliber/ai-editor:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: BASE_PATH
          value: "/"

---
apiVersion: v1
kind: Service
metadata:
  name: ai-editor-service
spec:
  selector:
    app: ai-editor
    env: production
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-editor-ingress
spec:
  ingressClassName: "traefik"
  rules:
  - host: "editor.gobha.ai"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-editor-service
            port:
              number: 80

---
