<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    /* Theme-aware coloring */
    @media (prefers-color-scheme: dark) {
      .bolt { fill: #fbbf24; }
      .bg { fill: #1f2937; }
    }
    @media (prefers-color-scheme: light) {
      .bolt { fill: #f59e0b; }
      .bg { fill: #ffffff; }
    }
  </style>
  <!-- Background circle -->
  <circle class="bg" cx="16" cy="16" r="14"/>
  <!-- Lightning bolt - centered and scaled for 16x16 visibility -->
  <path class="bolt" d="M18.5 6L11 14.5h4l-2.5 8.5 7.5-8.5h-4l2.5-8.5z"/>
</svg>