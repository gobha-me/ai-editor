# .gitea/workflows/ci.yaml
# ============================================
# AI Editor - CI/CD Pipeline (Template-Based)
# ============================================
# Deployment mapping:
#   PR opened/synced  → build :dev     → deploy ai-editor-dev     → editor.gobha.ai/dev
#   Push to main      → build :test    → deploy ai-editor-test    → editor.gobha.ai/test
#   Tag v*            → build :latest  → deploy ai-editor         → editor.gobha.ai/
#                       + :vX.Y.Z tag  → push to Docker Hub
#
# Required Gitea Variables (Settings → Actions → Variables):
#   REGISTRY      — e.g. registry.gobha.me:5000
#   NAMESPACE     — e.g. gobha-ai-editor
#   DOMAIN        — e.g. editor.gobha.ai
#   CERT_ISSUER   — e.g. letsencrypt-prod
#
# Optional Secrets (Settings → Actions → Secrets):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# ============================================

name: CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.event.pull_request.number || gitea.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.REGISTRY }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'xcaliber/ai-editor' }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'gobha/ai-editor' }}
  NAMESPACE: ${{ vars.NAMESPACE }}
  DOMAIN: ${{ vars.DOMAIN }}
  CERT_ISSUER: ${{ vars.CERT_ISSUER_PROD || 'letsencrypt-prod' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: >
      gitea.event_name == 'pull_request' ||
      gitea.ref == 'refs/heads/main' ||
      startsWith(gitea.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Version Coherence Check ──────────────────
      - name: Version coherence check
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Version coherence: js/version.js ↔ CHANGELOG.md"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          VERSION_JS=$(sed -n "s/^export const VERSION = '\([^']*\)'.*/\1/p" js/version.js | head -1)
          VERSION_CHANGELOG=$(sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' CHANGELOG.md | head -1)

          if [[ -z "$VERSION_JS" ]]; then
            echo "❌ FAIL: Could not parse VERSION from js/version.js"
            exit 1
          fi
          if [[ -z "$VERSION_CHANGELOG" ]]; then
            echo "❌ FAIL: Could not find any versioned heading in CHANGELOG.md"
            exit 1
          fi

          # X.Y.Z.N in-flight branch (docs/VERSIONING.md, adopted 2026-05-12).
          # The 4-segment stamp signals an in-flight sweep wave / multi-PR arc;
          # the [Unreleased] block holds entries and stays unpromoted until the
          # final .N-strip. The latest CHANGELOG heading is therefore the LAST
          # released X.Y.Z, not the in-flight one — the strict-equality check
          # below would always trip.
          if [[ "$VERSION_JS" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            STRIPPED="${VERSION_JS%.*}"
            echo "  js/version.js → $VERSION_JS  (X.Y.Z.N in-flight; target X.Y.Z = $STRIPPED)"
            echo "  CHANGELOG.md  → $VERSION_CHANGELOG  (last released)"
            if [[ "$STRIPPED" == "$VERSION_CHANGELOG" ]]; then
              echo ""
              echo "❌ FAIL: X.Y.Z.N stamp $VERSION_JS conflicts with already-released $VERSION_CHANGELOG"
              echo "  An X.Y.Z.N sub-patch is the in-flight prelude to a NEW vX.Y.Z tag."
              echo "  Bump the X.Y.Z target ahead of $VERSION_CHANGELOG, or drop the .N if"
              echo "  this PR is the final, testable-end-to-end commit of the wave."
              exit 1
            fi
            if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
              echo ""
              echo "❌ FAIL: CHANGELOG.md is missing the ## [Unreleased] block"
              echo "  X.Y.Z.N in-flight work accumulates entries under [Unreleased] until"
              echo "  the final .N-strip promotes them to ## [X.Y.Z] - YYYY-MM-DD."
              exit 1
            fi
            echo "✅ X.Y.Z.N in-flight; release-readiness gate fires when .N strips"
            exit 0
          fi

          echo "  js/version.js → $VERSION_JS"
          echo "  CHANGELOG.md  → $VERSION_CHANGELOG"

          if [[ "$VERSION_JS" != "$VERSION_CHANGELOG" ]]; then
            echo ""
            echo "❌ FAIL: Version drift detected"
            echo "  js/version.js says $VERSION_JS"
            echo "  Latest CHANGELOG heading is $VERSION_CHANGELOG"
            echo ""
            echo "Fix one of:"
            echo "  • If shipping a new version: bump js/version.js AND promote"
            echo "    ## [Unreleased] in CHANGELOG.md to ## [X.Y.Z] - YYYY-MM-DD"
            echo "  • If multi-PR / sweep-wave work: tag the in-flight version"
            echo "    as X.Y.Z.N per docs/VERSIONING.md (Plinth methodology)"
            echo "  • If post-release patch work: the two should already match"
            exit 1
          fi

          echo "✅ Version coherence: $VERSION_JS"

      # ── Node tests ───────────────────────────────
      # Uses Node already present in the ci-base image (no actions/setup-node
      # because act clones the action repo from GitHub on every run, which
      # adds minutes for no benefit). tests/test-smoke.mjs asserts the runner
      # has Node ≥ 20 so this fails loudly if the base image regresses.
      - name: Node tests (node --test)
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Running tests/test-*.mjs under node --test"
          echo "node: $(node --version)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          node --test tests/test-*.mjs

      # ── Security Lint ────────────────────────────
      - name: Security lint — innerHTML audit
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Checking for unsafe innerHTML patterns"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          ERRORS=0

          # P0: DOMPurify conditional — must never fall through to raw
          if grep -rn 'return raw;' js/ --include="*.js" | grep -v 'node_modules' | grep -q .; then
            echo "❌ FAIL: Found 'return raw;' — DOMPurify bypass detected"
            grep -rn 'return raw;' js/ --include="*.js" | grep -v 'node_modules'
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ No DOMPurify bypass patterns found"
          fi

          # Verify vendor security libs are in Dockerfile
          if ! grep -q 'purify.min.js' Dockerfile; then
            echo "❌ FAIL: DOMPurify not referenced in Dockerfile"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ DOMPurify referenced in Dockerfile"
          fi

          if [[ $ERRORS -gt 0 ]]; then
            echo ""
            echo "❌ Security lint failed with $ERRORS error(s)"
            exit 1
          fi
          echo "✅ Security lint passed"

      # ── Invisible Unicode Lint ──────────────────
      # Glassworm (U+E0000–U+E007F tags block), zero-width chars, and bidi
      # overrides (Trojan Source). Ranges must match
      # js/security/invisible-unicode.js INVISIBLE_RANGES and the
      # "Codepoint reference" section of docs/SECURITY.md.
      - name: Security lint — invisible Unicode
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Checking for invisible Unicode (glassworm / Trojan Source)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if grep -rPn '[\x{E0000}-\x{E007F}\x{200B}-\x{200F}\x{2060}-\x{206F}\x{FEFF}\x{202A}-\x{202E}\x{2066}-\x{2069}]' \
               js/ plugins/ tests/ \
               --include='*.js' --include='*.mjs' --include='*.json'; then
            echo ""
            echo "❌ FAIL: Invisible Unicode characters found"
            echo "   See docs/SECURITY.md for the threat model and codepoint reference."
            exit 1
          fi
          echo "✅ No invisible Unicode characters found"

      # ── Theme Token Contract Lint (1.3.5+) ──────
      # Enforces the Touch 2 facelift's frozen `--tk-*` vocabulary:
      # primary hex literals must live only in `css/themes/`. Component
      # CSS reads through the alias bridge in `css/base.css`. Defensive
      # `var(--name, #fallback)` patterns are exempt — those never fire
      # once the alias bridge resolves, but they survive a missing-link
      # scenario harmlessly. See `css/themes/tokens.css` for the
      # contract; `docs/ROADMAP.md` §1.3.5 for the rationale.
      - name: Theme token lint — no standalone hex outside css/themes/
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Theme token lint: standalone hex must live in css/themes/"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          # Standalone hex = a #RGB / #RRGGBB / #RRGGBBAA literal NOT
          # inside `var(...)`. Lines containing `var(--` are exempt.
          if grep -rEn '#[0-9a-fA-F]{3,8}\b' css/ \
               --include='*.css' \
               --exclude-dir=themes \
             | grep -v 'var(--'; then
            echo ""
            echo "❌ FAIL: Standalone hex literal(s) found outside css/themes/"
            echo "   Move the value into the --tk-* token contract"
            echo "   (css/themes/tokens.css) and reference it as"
            echo "   var(--tk-color-...) from component CSS."
            exit 1
          fi
          echo "✅ No standalone hex literals outside css/themes/"

      - name: Add /tools to PATH
        run: echo "/tools" >> $GITHUB_PATH
        
      - name: Install envsubst
        run: apt-get update -qq && apt-get install -y -qq gettext-base > /dev/null
        
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ gitea.event_name }}" == "pull_request" ]]; then
            echo "ENVIRONMENT=dev"         >> "$GITHUB_OUTPUT"
            echo "IMAGE_TAG=dev"           >> "$GITHUB_OUTPUT"
            echo "DEPLOY_NAME=ai-editor-dev" >> "$GITHUB_OUTPUT"
            echo "BASE_PATH=/dev"          >> "$GITHUB_OUTPUT"
            echo "PROBE_PATH=/dev/"        >> "$GITHUB_OUTPUT"
            echo "REPLICAS=1"              >> "$GITHUB_OUTPUT"
            echo "MEMORY_REQUEST=128Mi"    >> "$GITHUB_OUTPUT"
            echo "MEMORY_LIMIT=256Mi"      >> "$GITHUB_OUTPUT"
            echo "CPU_REQUEST=50m"         >> "$GITHUB_OUTPUT"
            echo "CPU_LIMIT=250m"          >> "$GITHUB_OUTPUT"
            echo "env_name=dev (PR #${{ gitea.event.pull_request.number }})" >> "$GITHUB_OUTPUT"
          elif [[ "${{ gitea.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ gitea.ref_name }}"
            echo "ENVIRONMENT=production"  >> "$GITHUB_OUTPUT"
            echo "IMAGE_TAG=latest"        >> "$GITHUB_OUTPUT"
            echo "EXTRA_TAG=${VERSION}"    >> "$GITHUB_OUTPUT"
            echo "DEPLOY_NAME=ai-editor"   >> "$GITHUB_OUTPUT"
            echo "BASE_PATH=/"             >> "$GITHUB_OUTPUT"
            echo "PROBE_PATH=/"            >> "$GITHUB_OUTPUT"
            echo "REPLICAS=2"              >> "$GITHUB_OUTPUT"
            echo "MEMORY_REQUEST=256Mi"    >> "$GITHUB_OUTPUT"
            echo "MEMORY_LIMIT=512Mi"      >> "$GITHUB_OUTPUT"
            echo "CPU_REQUEST=100m"        >> "$GITHUB_OUTPUT"
            echo "CPU_LIMIT=500m"          >> "$GITHUB_OUTPUT"
            echo "is_release=true"         >> "$GITHUB_OUTPUT"
            echo "env_name=production"     >> "$GITHUB_OUTPUT"
          else
            echo "ENVIRONMENT=test"        >> "$GITHUB_OUTPUT"
            echo "IMAGE_TAG=test"          >> "$GITHUB_OUTPUT"
            echo "DEPLOY_NAME=ai-editor-test" >> "$GITHUB_OUTPUT"
            echo "BASE_PATH=/test"         >> "$GITHUB_OUTPUT"
            echo "PROBE_PATH=/test/"       >> "$GITHUB_OUTPUT"
            echo "REPLICAS=1"              >> "$GITHUB_OUTPUT"
            echo "MEMORY_REQUEST=128Mi"    >> "$GITHUB_OUTPUT"
            echo "MEMORY_LIMIT=256Mi"      >> "$GITHUB_OUTPUT"
            echo "CPU_REQUEST=50m"         >> "$GITHUB_OUTPUT"
            echo "CPU_LIMIT=250m"          >> "$GITHUB_OUTPUT"
            echo "env_name=test (main)"    >> "$GITHUB_OUTPUT"
          fi

      # ── Build & Push to Internal Registry ──────
      - name: Build image
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Building ${REGISTRY}/${IMAGE_NAME}:${{ steps.env.outputs.IMAGE_TAG }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          docker build -t ${REGISTRY}/${IMAGE_NAME}:${{ steps.env.outputs.IMAGE_TAG }} .

      - name: Tag release version
        if: steps.env.outputs.EXTRA_TAG != ''
        run: |
          docker tag \
            ${REGISTRY}/${IMAGE_NAME}:${{ steps.env.outputs.IMAGE_TAG }} \
            ${REGISTRY}/${IMAGE_NAME}:${{ steps.env.outputs.EXTRA_TAG }}

      - name: Push to internal registry
        run: |
          docker push ${REGISTRY}/${IMAGE_NAME}:${{ steps.env.outputs.IMAGE_TAG }}
          if [[ -n "${{ steps.env.outputs.EXTRA_TAG }}" ]]; then
            docker push ${REGISTRY}/${IMAGE_NAME}:${{ steps.env.outputs.EXTRA_TAG }}
          fi

      # ── Docker Hub (release only) ───────────────
      - name: Login to Docker Hub
        if: steps.env.outputs.is_release == 'true' && secrets.DOCKERHUB_TOKEN != ''
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push to Docker Hub
        if: steps.env.outputs.is_release == 'true' && secrets.DOCKERHUB_TOKEN != ''
        run: |
          docker tag ${REGISTRY}/${IMAGE_NAME}:latest ${DOCKERHUB_IMAGE}:latest
          docker tag ${REGISTRY}/${IMAGE_NAME}:${{ steps.env.outputs.EXTRA_TAG }} ${DOCKERHUB_IMAGE}:${{ steps.env.outputs.EXTRA_TAG }}
          docker push ${DOCKERHUB_IMAGE}:latest
          docker push ${DOCKERHUB_IMAGE}:${{ steps.env.outputs.EXTRA_TAG }}

      # ── Deploy to Kubernetes ────────────────────
      - name: Ensure namespace exists
        run: |
          kubectl create namespace ${NAMESPACE} 2>/dev/null || true
          kubectl label namespace ${NAMESPACE} \
            service=ai-editor \
            managed-by=gitea-actions \
            domain=${DOMAIN} \
            --overwrite

      - name: Render manifest
        env:
          ENVIRONMENT: ${{ steps.env.outputs.ENVIRONMENT }}
          IMAGE_TAG: ${{ steps.env.outputs.IMAGE_TAG }}
          DEPLOY_NAME: ${{ steps.env.outputs.DEPLOY_NAME }}
          BASE_PATH: ${{ steps.env.outputs.BASE_PATH }}
          PROBE_PATH: ${{ steps.env.outputs.PROBE_PATH }}
          REPLICAS: ${{ steps.env.outputs.REPLICAS }}
          MEMORY_REQUEST: ${{ steps.env.outputs.MEMORY_REQUEST }}
          MEMORY_LIMIT: ${{ steps.env.outputs.MEMORY_LIMIT }}
          CPU_REQUEST: ${{ steps.env.outputs.CPU_REQUEST }}
          CPU_LIMIT: ${{ steps.env.outputs.CPU_LIMIT }}
        run: |
          envsubst < k8s/deployment.yaml > /tmp/manifest.yaml

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Rendered manifest for ${ENVIRONMENT}:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat /tmp/manifest.yaml

      - name: Apply and rollout
        run: |
          DEPLOY="${{ steps.env.outputs.DEPLOY_NAME }}"

          kubectl apply -f /tmp/manifest.yaml
          kubectl rollout restart deployment/${DEPLOY} -n ${NAMESPACE}
          kubectl rollout status deployment/${DEPLOY} -n ${NAMESPACE} --timeout=180s

      - name: Verify
        run: |
          DEPLOY="${{ steps.env.outputs.DEPLOY_NAME }}"
          ENV="${{ steps.env.outputs.ENVIRONMENT }}"

          kubectl get pods -n ${NAMESPACE} -l app=ai-editor,env=${ENV}

          READY=$(kubectl get deployment ${DEPLOY} -n ${NAMESPACE} -o jsonpath='{.status.readyReplicas}')
          DESIRED=$(kubectl get deployment ${DEPLOY} -n ${NAMESPACE} -o jsonpath='{.spec.replicas}')

          if [[ "${READY}" == "${DESIRED}" ]] && [[ "${READY}" -gt 0 ]]; then
            echo "✅ Healthy: ${READY}/${DESIRED} pods ready"
          else
            echo "❌ Unhealthy: ${READY:-0}/${DESIRED} pods ready"
            kubectl describe deployment ${DEPLOY} -n ${NAMESPACE}
            kubectl logs -n ${NAMESPACE} -l app=ai-editor,env=${ENV} --tail=50
            exit 1
          fi

      - name: Summary
        run: |
          URL="https://${DOMAIN}${{ steps.env.outputs.BASE_PATH }}"

          echo "## ✅ Deployed to ${{ steps.env.outputs.env_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Namespace** | \`${NAMESPACE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment** | \`${{ steps.env.outputs.DEPLOY_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${REGISTRY}/${IMAGE_NAME}:${{ steps.env.outputs.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${URL} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ steps.env.outputs.is_release }}" == "true" ]] && [[ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "| **Docker Hub** | \`${DOCKERHUB_IMAGE}:${{ steps.env.outputs.EXTRA_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          fi