name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
          
      - name: Build Docker image
        run: |
          docker build -t registry.gobha.me:5000/xcaliber/ai-editor:latest .
          
      - name: Push Docker image
        run: |
          docker push registry.gobha.me:5000/xcaliber/ai-editor:latest
