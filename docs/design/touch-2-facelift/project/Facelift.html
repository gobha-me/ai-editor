<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AI Editor — Facelift</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="topbar.jsx"></script>
<script type="text/babel" src="settings.jsx"></script>
<script type="text/babel" src="connections.jsx"></script>
<script type="text/babel" src="chat.jsx"></script>
<script type="text/babel" src="debug.jsx"></script>
<script type="text/babel" src="help.jsx"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="pushback.jsx"></script>

<script type="text/babel">
  function App() {
    const themes = ["refined", "editorial"];
    const themeNames = {
      refined: "Refined IDE",
      editorial: "Editorial Calm",
    };
    const themeBlurbs = {
      refined: "Same family as today (VSCode/Cursor lineage), executed properly. Inter UI, JetBrains Mono code, blue accent, restrained.",
      editorial: "Lower contrast, generous spacing, serif headings, warm neutrals. Source Serif 4 headings, IBM Plex body.",
    };

    return (
      <DesignCanvas>
        <DCSection id="memo" title="Strategy memo" subtitle="The argument before the pixels — read first">
          <DCArtboard id="memo" label="Pushback memo" width={780} height={1080}>
            <Pushback />
          </DCArtboard>
        </DCSection>

        <DCSection id="topbar" title="Top bar — LOCKED" subtitle="Restructure (icon row + ⌘K). 3 actions: Settings, Help, Debug. Both theme variants ship.">
          {themes.map((t) => (
            <DCArtboard key={"tb-res-"+t} id={"tb-res-"+t} label={`SHIP · ${themeNames[t]}`} width={920} height={56}>
              <TopBarRestructure theme={t} />
            </DCArtboard>
          ))}
        </DCSection>

        <DCSection id="settings" title="Settings — LOCKED" subtitle="Restructure (vertical sidebar grouped Workspace / AI / App). Both theme variants ship.">
          {themes.map((t) => (
            <DCArtboard key={"st-res-"+t} id={"st-res-"+t} label={`SHIP · ${themeNames[t]}`} width={820} height={560}>
              <SettingsRestructure theme={t} />
            </DCArtboard>
          ))}
        </DCSection>

        <DCSection id="connections" title="Connections — LOCKED" subtitle="N-of-each git providers — 2 GitHub, self-hosted Gitea + GitLab, plus aggregated repo picker">
          {themes.map((t) => (
            <DCArtboard key={"cn-base-"+t} id={"cn-base-"+t} label={`Per-provider list · ${themeNames[t]}`} width={860} height={620}>
              <ConnectionsList theme={t} variant="base" />
            </DCArtboard>
          ))}
          {themes.map((t) => (
            <DCArtboard key={"cn-pick-"+t} id={"cn-pick-"+t} label={`+ aggregated repo picker · ${themeNames[t]}`} width={860} height={920}>
              <ConnectionsList theme={t} variant="with-picker" />
            </DCArtboard>
          ))}
        </DCSection>

        <DCSection id="debug" title="Debug panel — NEW SURFACE" subtitle="Didn't exist before. Slide-out from right edge. Logs, connection health, indexer, AI, plugins.">
          {themes.map((t) => (
            <DCArtboard key={"dbg-logs-"+t} id={"dbg-logs-"+t} label={`Logs · ${themeNames[t]}`} width={780} height={620}>
              <DebugPanel theme={t} />
            </DCArtboard>
          ))}
        </DCSection>

        <DCSection id="help" title="Help panel — NEW SURFACE" subtitle="Didn't exist before. Slide-out from right edge. Left-rail nav, search-all, data-driven hotkeys.">
          <DCArtboard id="help-hk-refined" label="Hotkeys · Refined IDE · macOS" width={860} height={680}>
            <HelpPanel theme="refined" variant="hotkeys" platform="mac" />
          </DCArtboard>
          <DCArtboard id="help-hk-win" label="Hotkeys · Refined IDE · Windows" width={860} height={680}>
            <HelpPanel theme="refined" variant="hotkeys" platform="win" />
          </DCArtboard>
          <DCArtboard id="help-sdk-editorial" label="Plugin SDK · Editorial Calm" width={860} height={780}>
            <HelpPanel theme="editorial" variant="sdk" platform="mac" />
          </DCArtboard>
          <DCArtboard id="help-search-refined" label="Search results · Refined IDE" width={860} height={680}>
            <HelpPanel theme="refined" variant="search" platform="mac" />
          </DCArtboard>
        </DCSection>

        <DCSection id="chat" title="Chat panel — EXPLORATION" subtitle="Not locked. Three directions for review — pick one before building.">
          {themes.map((t) => (
            <DCArtboard key={"ch-pol-"+t} id={"ch-pol-"+t} label={`Polish · ${themeNames[t]}`} width={360} height={580}>
              <ChatPolish theme={t} />
            </DCArtboard>
          ))}
          {themes.map((t) => (
            <DCArtboard key={"ch-res-"+t} id={"ch-res-"+t} label={`Restructure · ${themeNames[t]}`} width={400} height={580}>
              <ChatRestructure theme={t} />
            </DCArtboard>
          ))}
          {themes.map((t) => (
            <DCArtboard key={"ch-rsk-"+t} id={"ch-rsk-"+t} label={`Reskin · ${themeNames[t]}`} width={400} height={580}>
              <ChatReskin theme={t} />
            </DCArtboard>
          ))}
        </DCSection>

        <DCSection id="tokens" title="Theme tokens — CONTRACT" subtitle="Public, append-only. Every --tk-* the app reads. Themes-as-plugins depend on this not changing.">
          {themes.map((t) => (
            <DCArtboard key={"tk-"+t} id={"tk-"+t} label={themeNames[t]} width={340} height={620}>
              <ThemeTokens theme={t} name={themeNames[t]} blurb={themeBlurbs[t]} />
            </DCArtboard>
          ))}
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
