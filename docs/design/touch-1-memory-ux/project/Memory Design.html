<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AI Editor — Memory Design (1.3.0)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles.css" />
<style>
  /* Canvas-only chrome (background of the design-canvas). */
  body { margin: 0; }
  /* Ensure dark cards on the warm canvas read crisply. */
  .artboard-frame, .mock-settings, .mock-modal {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-sans);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    overflow: hidden;
  }
  .artboard-titlebar {
    display: flex; align-items: center; gap: 0.4rem;
    padding: 0.5rem 0.75rem;
    background: var(--bg-tertiary);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: var(--font-xs);
    color: var(--text-muted);
  }
  .artboard-titlebar .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  .artboard-titlebar .dot:nth-child(1) { background: #f25c54; }
  .artboard-titlebar .dot:nth-child(2) { background: #f4a261; }
  .artboard-titlebar .dot:nth-child(3) { background: #6cc070; }
  .artboard-titlebar .path { margin-left: auto; opacity: 0.6; }
  .artboard-frame--chat { display: flex; flex-direction: column; height: 100%; }

  /* Pushback prose tweaks */
  .pushback-body p { margin: 0.4rem 0 0.6rem; }
  .pushback-body p:last-child { margin-bottom: 0; }
  .pushback-body code {
    font-family: var(--font-mono);
    font-size: 0.92em;
    background: rgba(255,255,255,0.04);
    padding: 1px 4px;
    border-radius: 2px;
    color: var(--text-primary);
  }
  .pushback-body strong { color: var(--text-primary); font-weight: 600; }
  .pushback-body a { color: var(--accent); }

  /* Pushback artboard wrapper (warm canvas → still a dark prose card) */
  .pushback-artboard {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    height: 100%;
    overflow: auto;
  }
</style>

<!-- React + Babel pinned per system requirements -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="flow1-consent.jsx"></script>
<script type="text/babel" src="flow2-settings.jsx"></script>
<script type="text/babel" src="flow3-commit.jsx"></script>
<script type="text/babel" src="pushback.jsx"></script>

<div id="root"></div>

<script type="text/babel" data-presets="react">
  function App() {
    const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;
    return (
      <DesignCanvas>
        <DCSection
          id="overview"
          title="AI Editor — Memory (v1.3.0)"
          subtitle="Three flows + pushback. Targeting Decisions §1, §4, §9, §10. Six weeks pre-code.">
          <DCArtboard id="pushback" label="Pushback on DESIGN-memory.md" width={840} height={1100}>
            <div className="pushback-artboard">
              <window.Pushback />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="flow1"
          title="Flow 1 · Memory consent in chat"
          subtitle="When the agent proposes a memory, how does Accept/Edit/Dismiss feel without being modal-spam?">
          <DCArtboard id="flow1-card" label="A · Inline card (recommended)" width={520} height={760}>
            <window.Flow1 />
          </DCArtboard>
          <DCPostIt width={240}>
            <strong>Why inline, not toast?</strong>
            <br/><br/>
            Toasts disappear → users feel surveilled. Inline keeps the proposal anchored to the turn that produced it; you can scroll back to find it.
            <br/><br/>
            Default action is <em>Remember</em>, not <em>Dismiss</em>. The agent already decided this was worth proposing — make the easy click the helpful one.
            <br/><br/>
            <strong>Edit-in-place</strong> matters: most proposals are 80% right. Forcing users into Settings to fix a comma kills adoption.
          </DCPostIt>
          <DCPostIt width={240}>
            <strong>Open question</strong><br/><br/>
            Proposal frequency. If the agent proposes 5+ memories per session, even the inline card becomes noise.
            <br/><br/>
            Suggest: hard-cap at 2/session by default, surface the rest as a single "3 more proposals →" expandable line at the end of the conversation.
          </DCPostIt>
        </DCSection>

        <DCSection
          id="flow2"
          title="Flow 2 · Memory tab placement"
          subtitle="11→12 tabs is fine for 1.3.0. The sidebar option is shown only as a forcing-function for 2.0.">
          <DCArtboard id="flow2a" label="A · In existing tab strip (recommended)" width={1040} height={720}>
            <window.Flow2A />
          </DCArtboard>
          <DCArtboard id="flow2b" label="B · Sidebar layout (defer to 2.0)" width={1040} height={720}>
            <window.Flow2B />
          </DCArtboard>
          <DCPostIt width={240}>
            <strong>Tab content is the same</strong>
            <br/><br/>
            Both artboards reuse the same Memory tab body. The only thing that changes between A and B is <em>placement</em>.
            <br/><br/>
            That's deliberate: the content question (list + audit + edit) is decoupled from the chrome question (tabs vs sidebar). Don't conflate them.
          </DCPostIt>
        </DCSection>

        <DCSection
          id="flow3"
          title="Flow 3 · Commit modal with pending memory writes"
          subtitle="Auto-stage on opt-in repos. On protected branches, surface as warning — but with an escape hatch.">
          <DCArtboard id="flow3a" label="A · Normal branch (auto-staged)" width={620} height={780}>
            <window.Flow3A />
          </DCArtboard>
          <DCArtboard id="flow3b" label="B · Protected branch (warn + offer branch-off)" width={620} height={780}>
            <window.Flow3B />
          </DCArtboard>
          <DCPostIt width={240}>
            <strong>Section, not banner</strong>
            <br/><br/>
            Memory writes live in their own labeled section, parallel to "Code changes". Same visual weight, different colour token (<code>--memory</code> vs neutral).
            <br/><br/>
            That's the "not scary" play: it's a normal commit section, just for a different file kind. Treating it as a warning by default would teach users to fear it.
            <br/><br/>
            Warning treatment is reserved for the protected-branch case where it's actually warranted.
          </DCPostIt>
          <DCPostIt width={240}>
            <strong>The escape hatch matters</strong>
            <br/><br/>
            "Branch off &amp; commit memory" creates <code>memory/auto-YYYYMMDD</code> with just the .aieditor/memory/ diff, opens it for review, then returns user to the original commit modal with code changes still pending.
            <br/><br/>
            Without this, users on main-as-default repos hit a dead end every commit.
          </DCPostIt>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
