<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Editor</title>
    <link rel="stylesheet" href="editor/css/editor.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>⚡ AI Editor <span class="version">v0.1.1</span></h1>
            <div class="header-actions">
                <button class="btn btn-secondary" id="btnToggleSidebar" title="Toggle Sidebar">📁</button>
                <button class="btn btn-secondary" id="btnSave" title="Save (Ctrl+S)" disabled>💾 Save</button>
                <button class="btn btn-secondary" id="btnSettings" title="Settings (Ctrl+,)">⚙️</button>
                <button class="btn btn-secondary" id="btnErrorLog" title="Error Log">🐛</button>
                <button class="btn btn-secondary" id="btnToggleChat" title="Toggle Chat">💬</button>
            </div>
        </header>
