<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Editor</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <!-- Self-hosted woff2 fonts (1.3.12+) — must register @font-face
         rules before any token resolves the families by name. Latin
         subsets, 19 files in assets/fonts/. Provenance in
         assets/fonts/SOURCES.md. Preload the two most-used Refined IDE
         faces so first paint isn't reflowed. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/inter-latin-400-normal.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/inter-latin-500-normal.woff2">
    <link rel="stylesheet" href="./css/themes/fonts.css">
    <!-- Theme tokens — public --tk-* contract (frozen) + active theme.
         Load order matters: tokens.css defines the contract with
         placeholder values; the theme file overrides them. base.css
         then aliases legacy --bg-*/--text-*/--accent vars to --tk-*.
         A theme switch swaps the active <link>; no other CSS changes. -->
    <link rel="stylesheet" href="./css/themes/tokens.css">
    <link rel="stylesheet" href="./css/themes/refined.css" id="theme-link" data-theme-name="refined">
    <!-- Stylesheets (split by component) -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/sidebar.css">
    <link rel="stylesheet" href="./css/editor.css">
    <link rel="stylesheet" href="./css/chat.css">
    <link rel="stylesheet" href="./css/modals.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/topbar.css">
    <link rel="stylesheet" href="./css/settings-sidebar.css">
    <link rel="stylesheet" href="./css/connections.css">
    <link rel="stylesheet" href="./css/slide-out.css">
    <link rel="stylesheet" href="./css/help.css">
    <link rel="stylesheet" href="./css/memory.css">
    <link rel="stylesheet" href="./css/icons.css">
    <link rel="stylesheet" href="./css/mobile.css">
    <!-- Vendor libs: local bundle first (Docker build), CDN fallback (dev mode) -->
    <script defer src="./vendor/marked.min.js"
        onerror="this.onerror=null; this.src='https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js'">
    </script>
    <script defer src="./vendor/purify.min.js"
        onerror="this.onerror=null; this.src='https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js'">
    </script>
    <script defer src="./vendor/jszip.min.js"
        onerror="this.onerror=null; this.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'">
    </script>
    <script type="module">
        // Set page title with version from central config
        import { VERSION_DISPLAY } from './js/version.js';
        document.title = VERSION_DISPLAY;
    </script>
</head>
<body>
    <!-- Boot Error Diagnostic -->
    <div id="bootErrors" style="display:none; background:#300; color:#faa; padding:12px 16px; font-family:monospace; font-size:12px; max-height:30vh; overflow:auto; border-bottom:2px solid #f00;">
        <strong>⚠️ JS ERRORS:</strong><pre id="bootErrorList" style="margin:4px 0 0 0; white-space:pre-wrap;"></pre>
    </div>
    <script>
        // Capture boot errors before modules load
        window._bootErrors = [];
        window.addEventListener('error', function(e) {
            window._bootErrors.push('[ERROR] ' + e.message + (e.filename ? ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno : ''));
            var el = document.getElementById('bootErrors');
            var list = document.getElementById('bootErrorList');
            if (el && list) { el.style.display = 'block'; list.textContent = window._bootErrors.join('\n'); }
        });
        window.addEventListener('unhandledrejection', function(e) {
            window._bootErrors.push('[REJECT] ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
            var el = document.getElementById('bootErrors');
            var list = document.getElementById('bootErrorList');
            if (el && list) { el.style.display = 'block'; list.textContent = window._bootErrors.join('\n'); }
        });
    </script>
    
    <!-- Skip Navigation -->
    <a href="#editorContainer" class="skip-nav" id="skipNav">Skip to editor</a>

    <!-- App Container - Templates loaded dynamically -->
    <div class="app-container" id="app">
        <!-- Loading indicator -->
        <div style="display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--text-muted);">
            <div style="text-align: center;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="40" height="40" aria-hidden="true" style="margin-bottom: 0.5rem;"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer" aria-live="polite" role="status"></div>

    <!-- Main Application Module -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
