<!-- Editor Panel (Center) -->
<main class="editor-panel" role="main" aria-label="Code editor">
    <!-- Tabs -->
    <div class="editor-tabs-bar">
        <div class="editor-tabs" id="editorTabs" role="tablist" aria-label="Open files">
            <div class="editor-tab active" role="tab" aria-selected="true">
                <span>Welcome</span>
            </div>
        </div>
        <div class="editor-toolbar" role="toolbar" aria-label="Editor tools">
            <button type="button" class="btn btn-secondary btn-toolbar" id="btnRevert" title="Revert current file to last commit (Ctrl+Shift+Z)" aria-label="Revert file" disabled>↩️ Revert</button>
            <button type="button" class="btn btn-secondary btn-toolbar" id="btnToggleLineNumbers" title="Toggle Line Numbers (Ctrl+Shift+L)" aria-label="Toggle line numbers">🔢</button>
            <button type="button" class="btn btn-secondary btn-toolbar" id="btnTogglePreview" title="Toggle Preview (Ctrl+Shift+P)" aria-label="Toggle preview" disabled>👁 Preview</button>
            <button type="button" class="btn btn-secondary btn-toolbar" id="btnToggleDiff" title="Toggle Diff (Ctrl+Shift+D)" aria-label="Toggle diff view" disabled>± Diff</button>
            <button type="button" class="btn btn-secondary btn-toolbar" id="btnToggleBlame" title="Toggle Blame (Ctrl+Shift+B)" aria-label="Toggle blame view" disabled>🔍 Blame</button>
        </div>
    </div>

    <!-- Editor + Secondary Pane Container -->
    <div class="editor-split" id="editorSplit">
        <!-- Editor Container -->
        <div class="editor-container" id="editorContainer" role="region" aria-label="Code editor content">
            <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted);">
                <div style="text-align: center; max-width: 360px;">
                    <h2 style="font-size: var(--font-2xl); margin-bottom: 0.75rem;">⚡ <span id="welcomeAppName"></span></h2>
                    <p style="margin-bottom: 1rem;">Select a project from the sidebar, or upload a zip to start editing.</p>
                    <div style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
                        <button type="button" class="btn btn-primary" onclick="window.openSettings()">
                            ⚙️ Settings
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="window.openZipUpload && window.openZipUpload()">
                            📦 Upload Zip
                        </button>
                    </div>
                    <p style="margin-top: 1rem; font-size: var(--font-md); color: var(--text-muted);">
                        Press <kbd style="padding: 1px 5px; border: 1px solid var(--border); border-radius: 3px; font-size: var(--font-sm);">F1</kbd> for keyboard shortcuts
                    </p>
                </div>
            </div>
        </div>

        <!-- Resize Handle (Editor ↔ Preview/Diff) -->
        <div class="resize-handle resize-handle-preview" id="resizeHandlePreview" role="separator" aria-orientation="vertical" aria-label="Resize editor and preview" style="display: none;"></div>

        <!-- Secondary Pane (Preview / Diff) -->
        <div class="secondary-pane" id="secondaryPane" role="region" aria-label="Preview pane" style="display: none;">
            <div class="secondary-pane-header">
                <span id="secondaryPaneTitle">Preview</span>
                <div class="secondary-pane-actions">
                    <button type="button" class="btn btn-secondary btn-toolbar" id="btnSecondaryFullscreen" onclick="window.toggleSecondaryFullscreen()" title="Toggle Fullscreen" aria-label="Toggle preview fullscreen">⛶</button>
                    <button type="button" class="btn btn-secondary btn-toolbar" onclick="window.closeSecondaryPane()" title="Close" aria-label="Close preview pane">✕</button>
                </div>
            </div>
            <div class="secondary-pane-content" id="secondaryPaneContent">
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="editor-status" role="status" aria-live="polite" aria-label="Editor status">
        <div class="status-left">
            <span class="status-item" id="statusFile">No file open</span>
            <span class="status-item" id="statusModified"></span>
        </div>
        <div class="status-right">
            <span class="status-item" id="statusBranch">main</span>
            <span class="status-item" id="statusConnection">●</span>
        </div>
    </div>
</main>
