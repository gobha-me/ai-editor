<!-- Sidebar (Left) -->
<aside class="sidebar" id="sidebar" role="complementary" aria-label="Project navigation">
    <!-- Project Selector -->
    <div class="sidebar-section">
        <div class="sidebar-header">
            Projects
            <button type="button" id="btnRefreshProjects" title="Refresh" aria-label="Refresh projects">🔄</button>
        </div>
        <div class="project-selector">
            <label for="projectSelect" class="sr-only">Project</label>
            <select id="projectSelect" aria-label="Select project">
                <option value="">Select a project...</option>
            </select>
        </div>
        <div class="branch-selector">
            <label for="branchSelect" class="sr-only">Branch</label>
            <select id="branchSelect" aria-label="Select branch">
                <option value="main">main</option>
            </select>
            <button type="button" class="btn btn-secondary" id="btnNewBranch" title="New Branch" aria-label="Create new branch">+</button>
        </div>
    </div>

    <!-- File Tree -->
    <div class="sidebar-section sidebar-section-flex">
        <div class="sidebar-header sidebar-header-collapsible" data-collapse="fileTreeBody" role="button" tabindex="0" aria-expanded="true" aria-controls="fileTreeBody">
            <span>▾ Files</span>
            <div>
                <button type="button" id="btnZipUploadOpen" title="Upload Zip" aria-label="Upload zip file" onclick="event.stopPropagation(); window.openZipUpload()">📦</button>
                <button type="button" id="btnNewFile" title="New File" aria-label="Create new file" onclick="event.stopPropagation()">📄</button>
                <button type="button" id="btnNewFolder" title="New Folder" aria-label="Create new folder" onclick="event.stopPropagation()">📁</button>
            </div>
        </div>
        <div class="sidebar-collapse-body" id="fileTreeBody" role="tree" aria-label="File tree">
            <div class="file-tree" id="fileTree">
                <div style="padding: 1rem; color: var(--text-muted); text-align: center;">
                    Select a project to browse files
                </div>
            </div>
        </div>
    </div>

    <!-- Issues Panel -->
    <div class="sidebar-section sidebar-section-bottom">
        <div class="sidebar-header sidebar-header-collapsible" data-collapse="issuesPanelBody" role="button" tabindex="0" aria-expanded="true" aria-controls="issuesPanelBody">
            <span>▾ Issues</span>
            <button type="button" id="btnRefreshIssues" title="Refresh" aria-label="Refresh issues" onclick="event.stopPropagation()">🔄</button>
        </div>
        <div class="sidebar-collapse-body" id="issuesPanelBody">
            <div class="issues-panel" id="issuesPanel" role="list" aria-label="Issues">
                <div style="padding: 0.75rem; color: var(--text-muted); font-size: 12px;">
                    No issues loaded
                </div>
            </div>
        </div>
    </div>

    <!-- Pull Requests -->
    <div class="sidebar-section sidebar-section-bottom">
        <div class="sidebar-header sidebar-header-collapsible" data-collapse="prsPanelBody" role="button" tabindex="0" aria-expanded="true" aria-controls="prsPanelBody">
            <span>▾ Pull Requests</span>
            <div style="display: flex; gap: 2px;">
                <button type="button" id="btnNewPR" title="Create Pull Request" aria-label="Create pull request" onclick="event.stopPropagation(); window.openCreatePRModal()">➕</button>
                <button type="button" id="btnRefreshPRs" title="Refresh" aria-label="Refresh pull requests" onclick="event.stopPropagation()">🔄</button>
            </div>
        </div>
        <div class="sidebar-collapse-body" id="prsPanelBody">
            <div class="prs-panel" id="prsPanel" role="list" aria-label="Pull requests">
                <div style="padding: 0.75rem; color: var(--text-muted); font-size: 12px;">
                    No pull requests
                </div>
            </div>
        </div>
    </div>
</aside>
