<!-- Sidebar (Left) -->
<aside class="sidebar" id="sidebar" role="complementary" aria-label="Project navigation">
    <!-- Project Selector -->
    <div class="sidebar-section">
        <div class="sidebar-header">
            <div style="display: flex; align-items: center; gap: 0.35rem;">
                <button type="button" class="panel-collapse-btn" id="btnCollapseSidebar" title="Collapse sidebar" aria-label="Collapse sidebar">
                    <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
                </button>
                Projects
            </div>
            <div style="display: flex; gap: 2px;">
                <button type="button" id="btnNewProject" title="New Project" aria-label="Create new project">
                    <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button type="button" id="btnRefreshProjects" title="Refresh" aria-label="Refresh projects">
                    <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                </button>
                <button type="button" id="btnClearProject" title="Clear Project" aria-label="Clear current project">
                    <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
        </div>
        <div class="project-selector">
            <label for="projectSelect" class="sr-only">Project</label>
            <select id="projectSelect" aria-label="Select project">
                <option value="">Select a project...</option>
            </select>
        </div>
        <div class="branch-selector">
            <div class="branch-selector__toolbar">
                <span class="branch-selector__title">Branches</span>
                <div class="branch-selector__toolbar-actions">
                    <button type="button" class="btn btn-secondary" id="btnNewBranch" title="New Branch" aria-label="Create new branch">
                        <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                    <button type="button" class="btn btn-secondary" id="btnDownloadZip" title="Download project as zip" aria-label="Download project as zip">
                        <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
                    </button>
                    <button type="button" class="btn btn-secondary" id="btnRelease" title="Release Manager" aria-label="Release manager" onclick="window.openReleaseModal()">
                        <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
                    </button>
                </div>
            </div>
            <div class="branch-panel" id="branchPanel" role="list" aria-label="Branches">
                <div class="branch-panel__empty" style="padding: 0.5rem 0.25rem; color: var(--text-muted); font-size: var(--font-xs, 0.75rem);">
                    No project loaded
                </div>
            </div>
        </div>
    </div>

    <!-- Resizable sections container -->
    <div class="sidebar-sections-resizable" id="sidebarSections">
        <!-- File Tree -->
        <div class="sidebar-section sidebar-section-resizable" id="sectionFiles" data-section="files">
            <div class="sidebar-header sidebar-header-collapsible" data-collapse="fileTreeBody" role="button" tabindex="0" aria-expanded="true" aria-controls="fileTreeBody">
                <span>▾ Files</span>
                <div>
                    <button type="button" id="btnRefreshFiles" title="Refresh file tree" aria-label="Refresh file tree" onclick="event.stopPropagation()">
                        <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                    </button>
                    <button type="button" id="btnZipUploadOpen" title="Upload Zip" aria-label="Upload zip file" onclick="event.stopPropagation(); window.openZipUpload()">
                        <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 16-9 5-9-5V8l9-5 9 5v8Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>
                    </button>
                    <button type="button" id="btnNewFile" title="New File" aria-label="Create new file" onclick="event.stopPropagation()">
                        <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 12v6M9 15h6"/></svg>
                    </button>
                    <button type="button" id="btnNewFolder" title="New Folder" aria-label="Create new folder" onclick="event.stopPropagation()">
                        <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M12 11v6M9 14h6"/></svg>
                    </button>
                </div>
            </div>
            <div class="sidebar-collapse-body" id="fileTreeBody" role="tree" aria-label="File tree">
                <div class="file-tree" id="fileTree">
                    <div style="padding: 1rem; color: var(--text-muted); text-align: center;">
                        Select a project to browse files
                    </div>
                </div>
            </div>
        </div>

        <!-- Resize handle: Files ↔ Issues -->
        <div class="sidebar-resize-handle" data-above="sectionFiles" data-below="sectionIssues" title="Drag to resize" role="separator" aria-orientation="horizontal"></div>

        <!-- Issues Panel -->
        <div class="sidebar-section sidebar-section-resizable" id="sectionIssues" data-section="issues">
            <div class="sidebar-header sidebar-header-collapsible" data-collapse="issuesPanelBody" role="button" tabindex="0" aria-expanded="true" aria-controls="issuesPanelBody">
                <span>▾ Issues</span>
                <button type="button" id="btnRefreshIssues" title="Refresh" aria-label="Refresh issues" onclick="event.stopPropagation()">
                    <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                </button>
            </div>
            <div class="sidebar-collapse-body" id="issuesPanelBody">
                <div class="issues-panel" id="issuesPanel" role="list" aria-label="Issues">
                    <div style="padding: 0.75rem; color: var(--text-muted); font-size: 12px;">
                        No issues loaded
                    </div>
                </div>
            </div>
        </div>

        <!-- Resize handle: Issues ↔ PRs -->
        <div class="sidebar-resize-handle" data-above="sectionIssues" data-below="sectionPRs" title="Drag to resize" role="separator" aria-orientation="horizontal"></div>

        <!-- Pull Requests -->
        <div class="sidebar-section sidebar-section-resizable" id="sectionPRs" data-section="prs">
            <div class="sidebar-header sidebar-header-collapsible" data-collapse="prsPanelBody" role="button" tabindex="0" aria-expanded="true" aria-controls="prsPanelBody">
                <span>▾ Pull Requests</span>
                <div style="display: flex; gap: 2px;">
                    <button type="button" id="btnNewPR" title="Create Pull Request" aria-label="Create pull request" onclick="event.stopPropagation(); window.openCreatePRModal()">
                        <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                    <button type="button" id="btnRefreshPRs" title="Refresh" aria-label="Refresh pull requests" onclick="event.stopPropagation()">
                        <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                    </button>
                </div>
            </div>
            <div class="sidebar-collapse-body" id="prsPanelBody">
                <div class="prs-panel" id="prsPanel" role="list" aria-label="Pull requests">
                    <div style="padding: 0.75rem; color: var(--text-muted); font-size: 12px;">
                        No pull requests
                    </div>
                </div>
            </div>
        </div>
    </div>
</aside>
