<!-- Sidebar (Left) — Touch 3 Rail v2 layout (2.11.0) -->
<aside class="sidebar lp lp--rail" id="sidebar" role="complementary" aria-label="Project navigation">
    <!-- Project selector — stays at the top of the sidebar above the rail. -->
    <div class="sidebar-section sidebar-section--project">
        <div class="sidebar-header">
            <div style="display: flex; align-items: center; gap: 0.35rem;">
                <button type="button" class="panel-collapse-btn" id="btnCollapseSidebar" title="Collapse sidebar" aria-label="Collapse sidebar">
                    <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
                </button>
                Projects
            </div>
            <div style="display: flex; gap: 2px;">
                <button type="button" id="btnNewProject" title="New Project" aria-label="Create new project">
                    <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button type="button" id="btnRefreshProjects" title="Refresh" aria-label="Refresh projects">
                    <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                </button>
                <button type="button" id="btnClearProject" title="Clear Project" aria-label="Clear current project">
                    <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
                <button type="button" id="btnProjectActions" title="Project actions: import / export" aria-label="Project actions" aria-haspopup="menu" aria-expanded="false">
                    <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                </button>
            </div>
        </div>
        <div class="project-selector">
            <label for="projectSelect" class="sr-only">Project</label>
            <select id="projectSelect" aria-label="Select project">
                <option value="">Select a project...</option>
            </select>
            <!-- Touch 3 zip-flow popover (2.20.0). Rendered hidden by default; toggled by #btnProjectActions. -->
            <div id="projectActionsMenu" class="zip-menu" role="menu" aria-labelledby="btnProjectActions" hidden></div>
        </div>
    </div>

    <!-- Rail body — icon column + view container. -->
    <div class="lp__rail-body">
        <div class="lp__rail" id="leftPaneRailButtons" role="tablist" aria-label="Left pane views">
            <!-- Buttons rendered by js/ui/left-pane-rail.js#mountLeftPaneRail() -->
        </div>

        <!-- Rail-view containers (header + body for Files / Issues / PRs / Branches)
             are rendered declaratively by js/ui/left-pane-rail.js#rebuild() from
             `view.headerActions` + `render(body)` on each `rail-views` contribution.
             The four built-in views register at boot in BUILTIN_VIEWS; providers
             can contribute additional views (2.22.0 SlotManager, 2.23.0 rail-views
             slot kind, 2.24.0 body migration). -->
        <div class="lp__rail-content"></div>
    </div>

    <!-- SlotManager mount (2.22.0) — additive surface for provider/plugin panels. -->
    <div data-slot="sidebar-panels"></div>
</aside>
