<!-- Header — 1.3.6 Touch 2 Restructure (icons swapped to Lucide line in 1.3.11) -->
<header class="app-header tb tb--restructure" role="banner">
    <div class="tb__brand">
        <span class="tb__brand-mark" aria-hidden="true">
            <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
        </span>
        <span class="tb__brand-name" id="appName"></span>
        <span class="version" id="appVersion"></span>
    </div>

    <div class="tb__divider" aria-hidden="true"></div>

    <button type="button" class="tb__btn tb__branch" id="tbBranchIndicator"
            title="Current branch" aria-label="Current branch" disabled>
        <span class="tb__branch-icon" aria-hidden="true">
            <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="3" r="2"/><circle cx="6" cy="21" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 5v14M6 14a6 6 0 0 1 6-6h2a4 4 0 0 0 4-4"/></svg>
        </span>
        <span class="tb__branch-name" id="tbBranchName">—</span>
        <span class="tb__branch-counts" id="tbBranchCounts" hidden></span>
    </button>

    <button type="button" class="tb__cmd" id="tbCmdK"
            title="Quick open (Ctrl+K)" aria-label="Quick open command surface">
        <span class="tb__cmd-icon" aria-hidden="true">
            <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </span>
        <span class="tb__cmd-placeholder">Search files…</span>
        <kbd class="tb__cmd-kbd">Ctrl K</kbd>
    </button>

    <nav class="header-actions tb__right" aria-label="Main actions">
        <div class="tb__usage" id="costTrackerBar" aria-label="Session cost">
            <span id="costTrackerText">0 tok</span>
        </div>

        <!-- SlotManager mount (2.22.0) — additive surface for status pills (compression, tool count, etc.).
             Catalog name is "status-bar"; remapped from "bottom of app shell" to the top-bar pill row
             since the 1.3.6 Touch 2 Restructure consolidated status pills here. -->
        <div data-slot="status-bar"></div>

        <div class="tb__divider" aria-hidden="true"></div>

        <button type="button" class="btn btn-commit" id="btnCommit"
                title="Commit all changes" aria-label="Commit changes" style="display: none;">
            <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 16-9 5-9-5V8l9-5 9 5v8Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>
            <span>Commit</span>
        </button>

        <button type="button" class="tb__btn tb__btn--icon" id="btnSettings"
                title="Settings (Ctrl+,)" aria-label="Settings">
            <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1 1.7 1.7 0 0 0 .3 1.8M3 11a2 2 0 1 0 0 4h.1a1.7 1.7 0 0 1 1.5 1M5.6 5.6a2 2 0 0 0 0 2.8M11 3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5"/></svg>
        </button>
        <button type="button" class="tb__btn tb__btn--icon" id="btnHelp"
                title="Help (F1)" aria-label="Help">
            <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg>
        </button>

        <!-- 1.3.9: dropdown retired. Single button opens the Debug
             slide-out (Logs / Connections / Indexer / AI / Plugins). -->
        <button type="button" class="tb__btn tb__btn--icon" id="btnDebugMenu"
                title="Debug" aria-label="Open debug panel">
            <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h8v6a4 4 0 0 1-8 0ZM2 22l3-3M22 22l-3-3"/></svg>
        </button>
    </nav>
</header>
