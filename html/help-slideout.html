<!-- Help slide-out — 1.3.10 Touch 2 net-new surface
     Right-edge drawer per docs/design/touch-2-facelift/project/help.jsx.
     Replaces the 6-tab #helpModal and inherits the 1.3.9 .slide-out shell.
     The .slide-out--wide modifier (defined in css/help.css) widens the
     drawer so the left-rail nav + content pane both fit. -->
<div class="slide-out-overlay" id="helpSlideOut" role="dialog"
     aria-modal="true" aria-labelledby="helpSlideOutTitle" aria-hidden="true">
    <aside class="slide-out slide-out--wide" role="document">
        <div class="help">
            <div class="help__head">
                <div class="help__title" id="helpSlideOutTitle">
                    <svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15ZM6.5 17H20v5H6.5A2.5 2.5 0 0 1 4 19.5v0A2.5 2.5 0 0 1 6.5 17Z"/></svg>
                    <span>Help &amp; docs</span>
                </div>
                <div class="help__head-spacer" aria-hidden="true"></div>
                <button type="button" class="help__head-btn help__head-btn--icon"
                        id="helpCloseBtn" title="Close (Esc)" aria-label="Close">
                    <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>

            <div class="help__body">
                <aside class="help__nav" id="helpNav">
                    <div class="help__search-wrap">
                        <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                        <input type="search" class="help__search-input" id="helpSearchInput"
                               placeholder="Search all docs…" aria-label="Search docs">
                        <kbd class="help-kbd help-kbd--hint" id="helpSearchHint">⌘/</kbd>
                    </div>
                    <div id="helpNavList"></div>
                </aside>

                <div class="help__content" id="helpContent" tabindex="0"
                     role="region" aria-label="Help content"></div>
            </div>

            <div class="help__foot">
                <a class="help__foot-link" href="https://github.com/gobha-me/ai-editor"
                   target="_blank" rel="noopener noreferrer"
                   title="View source on GitHub">
                    <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.5c3-.4 6.1-1.5 6.1-6.7A5.2 5.2 0 0 0 19.8 5a4.9 4.9 0 0 0-.1-3.5s-1.2-.4-3.7 1.4a13 13 0 0 0-7 0C6.5 1 5.3 1.5 5.3 1.5A4.9 4.9 0 0 0 5.2 5a5.2 5.2 0 0 0-1.4 3.6c0 5.2 3.1 6.3 6.1 6.7a3.4 3.4 0 0 0-.9 2.5V22"/></svg>
                    <span>GitHub</span>
                </a>
                <span class="help__foot-sep" aria-hidden="true">·</span>
                <a class="help__foot-link" href="https://buymeacoffee.com/jeffasmith"
                   target="_blank" rel="noopener noreferrer"
                   title="Support AI Editor development">
                    <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 8h1a4 4 0 1 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8ZM6 2v3M10 2v3M14 2v3"/></svg>
                    <span>Buy me a coffee</span>
                </a>
                <div class="help__foot-spacer" aria-hidden="true"></div>
                <span class="help__foot-meta" id="helpFootMeta"></span>
            </div>
        </div>
    </aside>
</div>
