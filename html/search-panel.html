<!-- Project Search Panel (Ctrl+Shift+F) -->
<div class="search-panel" id="searchPanel" role="search" aria-label="Project search">
    <div class="search-panel-header">
        <div class="search-input-wrapper">
            <span class="search-icon" aria-hidden="true">
                <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </span>
            <label for="searchInput" class="sr-only">Search in project</label>
            <input type="text" id="searchInput" placeholder="Search in project..." autocomplete="off" spellcheck="false" aria-label="Search query">
        </div>
        <div class="search-options" role="group" aria-label="Search options">
            <label class="search-option" title="Match case">
                <input type="checkbox" id="searchCaseSensitive" aria-label="Match case"> <span aria-hidden="true">Aa</span>
            </label>
            <label class="search-option" title="Regular expression">
                <input type="checkbox" id="searchRegex" aria-label="Regular expression"> <span aria-hidden="true">.*</span>
            </label>
            <label class="search-option" title="Whole word">
                <input type="checkbox" id="searchWholeWord" aria-label="Whole word"> <span aria-hidden="true">\\b</span>
            </label>
        </div>
        <div class="search-actions">
            <button type="button" class="btn btn-primary" id="btnDoSearch" aria-label="Run search">Search</button>
            <button type="button" class="btn btn-secondary" id="btnToggleReplace" title="Toggle replace" aria-label="Toggle replace" aria-expanded="false" aria-controls="replaceBar">
                <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 4-3 3 3 3M4 7h13M17 14l3 3-3 3M20 17H7"/></svg>
            </button>
            <button type="button" class="btn btn-secondary" id="btnCloseSearch" title="Close" aria-label="Close search panel">
                <svg class="icn icn--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>
    </div>

    <!-- Replace bar (hidden by default) -->
    <div class="replace-bar" id="replaceBar" style="display: none;">
        <label for="replaceInput" class="sr-only">Replace with</label>
        <input type="text" class="replace-input" id="replaceInput" placeholder="Replace with..." aria-label="Replacement text">
        <button type="button" class="btn btn-secondary" id="btnReplaceAll" title="Replace all matches" aria-label="Replace all matches">Replace All</button>
    </div>

    <!-- Search status -->
    <div class="search-status" id="searchStatus" role="status" aria-live="polite" style="display: none;">
        <span id="searchStatusText"></span>
    </div>

    <!-- Results -->
    <div class="search-results" id="searchResults" role="list" aria-label="Search results">
        <!-- Populated dynamically -->
    </div>
</div>
