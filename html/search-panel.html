<!-- Project Search Panel (Ctrl+Shift+F) -->
<div class="search-panel" id="searchPanel">
    <div class="search-panel-header">
        <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search in project..." autocomplete="off" spellcheck="false">
        </div>
        <div class="search-options">
            <label class="search-option" title="Match case">
                <input type="checkbox" id="searchCaseSensitive"> <span>Aa</span>
            </label>
            <label class="search-option" title="Regular expression">
                <input type="checkbox" id="searchRegex"> <span>.*</span>
            </label>
            <label class="search-option" title="Whole word">
                <input type="checkbox" id="searchWholeWord"> <span>\\b</span>
            </label>
        </div>
        <div class="search-actions">
            <button class="btn btn-primary" id="btnDoSearch">Search</button>
            <button class="btn btn-secondary" id="btnToggleReplace" title="Toggle replace">⇄</button>
            <button class="btn btn-secondary" id="btnCloseSearch" title="Close">✕</button>
        </div>
    </div>

    <!-- Replace bar (hidden by default) -->
    <div class="replace-bar" id="replaceBar" style="display: none;">
        <input type="text" class="replace-input" id="replaceInput" placeholder="Replace with...">
        <button class="btn btn-secondary" id="btnReplaceAll" title="Replace all matches">Replace All</button>
    </div>

    <!-- Search status -->
    <div class="search-status" id="searchStatus" style="display: none;">
        <span id="searchStatusText"></span>
    </div>

    <!-- Results -->
    <div class="search-results" id="searchResults">
        <!-- Populated dynamically -->
    </div>
</div>
